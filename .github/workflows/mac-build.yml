name: Mac Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.2.2)'
        required: true

jobs:
  mac:
    runs-on: macos-latest

    steps:
      - name: Determine signing mode
        id: signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_CSC_KEY_PASSWORD" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "Signing mode: Developer ID"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "Signing mode: ad-hoc proof build"
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Braban1/wake-src
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Download yt-dlp (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BINDIR=node_modules/youtube-dl-exec/bin
          mkdir -p "$BINDIR"
          gh release download --repo yt-dlp/yt-dlp --pattern "yt-dlp_macos" -D "$BINDIR/"
          mv "$BINDIR/yt-dlp_macos" "$BINDIR/yt-dlp"
          chmod +x "$BINDIR/yt-dlp"

      - name: Build
        run: npm run build

      - name: Write ad-hoc signing hook
        if: steps.signing.outputs.mode == 'adhoc'
        run: |
          cat > adhoc-sign.cjs <<'EOF'
          const { execFileSync } = require('node:child_process');
          const path = require('node:path');

          exports.default = async function (ctx) {
            if (ctx.electronPlatformName !== 'darwin') return;

            const app = path.join(
              ctx.appOutDir,
              `${ctx.packager.appInfo.productFilename}.app`,
            );

            console.log('[adhoc-sign] re-signing ad-hoc:', app);
            execFileSync('codesign', ['--force', '--deep', '--sign', '-', app], {
              stdio: 'inherit',
            });
          };
          EOF

      - name: Package macOS DMG (Developer ID)
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never

      - name: Package macOS DMG (ad-hoc proof)
        if: steps.signing.outputs.mode == 'adhoc'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac --publish never \
            -c.mac.identity=null \
            -c.mac.hardenedRuntime=false \
            -c.afterPack=./adhoc-sign.cjs

      - name: Verify packaged DMG
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          if ! compgen -G "release/*.dmg" > /dev/null; then
            echo "No .dmg found under release/"
            exit 1
          fi

          for DMG in release/*.dmg; do
            echo "DMG: $DMG"
            hdiutil verify "$DMG"

            MOUNT_DIR=$(mktemp -d)
            hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
            trap 'hdiutil detach "$MOUNT_DIR" || true; rmdir "$MOUNT_DIR" || true' EXIT

            APP=$(find "$MOUNT_DIR" -maxdepth 2 -name '*.app' -print -quit)
            if [ -z "$APP" ]; then
              echo "No .app found inside $DMG"
              exit 1
            fi

            echo "App bundle inside DMG: $APP"
            codesign -dv --verbose=4 "$APP" || true
            codesign --verify --deep --strict --verbose=2 "$APP"

            if [ "$SIGNING_MODE" = "adhoc" ]; then
              codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'
            fi

            spctl -a -vvv -t exec "$APP" || true
            hdiutil detach "$MOUNT_DIR"
            rmdir "$MOUNT_DIR"
            trap - EXIT
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/*.dmg
          if-no-files-found: error
