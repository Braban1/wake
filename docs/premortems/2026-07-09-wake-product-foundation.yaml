premortem:
  status: BLOCK
  tigers:
    - risk: "Implementation starts against packaged bundles because canonical source remains inaccessible."
      evidence: "Braban1/wake contains only README.md and .github/workflows/mac-build.yml; gh, HTTPS Git, and SSH Git cannot access Braban1/wake-src; public Git lacks source commit 0966e21."
      root_cause: "Release ownership and source ownership were separated without durable access or a verified source backup."
      bias: "Planning fallacy and sunk-cost bias make incremental bundle patching appear faster than recovering maintainable source."
      falsifiable_test: "gh repo view Braban1/wake-src and git ls-remote for refs/tags/v0.2.2 succeed for bilal-ghafoor, or a full source backup reproduces the v0.2.2 baseline."
      mitigation: "Block source implementation until access is granted or a complete backup is approved; restore into a canonical private repository with multiple administrators, a recoverable backup, and a tested recovery drill; require a separate explicit decision before bundle reconstruction."
    - risk: "The public release workflow remains the de facto application source and accumulates brittle post-build rewrites."
      evidence: "PR #1 applies runtime, OAuth, tab, import, and extension changes by replacing strings in out/main/index.js after compilation."
      root_cause: "No writable canonical source surface is available to the current operator."
      bias: "Availability bias favors the workflow because it is the only visible code path."
      falsifiable_test: "Every current runtime patch exists in reviewed source modules with tests, and the release workflow contains no application-behavior rewrite step."
      mitigation: "Keep PR #1 draft, recover source, port behavior into source PRs, then retain only signing/build mechanics in the feed workflow."
    - risk: "Electron modernization breaks supported macOS, native modules, extension behavior, or provider compatibility."
      evidence: "Wake embeds Electron 34.5.8; Electron 43.1.0 is the current planning baseline, requires macOS 12, and crosses nine major Electron versions, but it may no longer be the supported stable release when source access returns."
      root_cause: "The browser runtime was allowed to fall outside Electron's supported release window."
      bias: "Recency bias may treat the newest runtime as a drop-in upgrade."
      falsifiable_test: "A dedicated runtime branch locks the latest stable Electron release that satisfies native WebAuthn and the declared macOS floor, then passes the full build/package, fixture, extension, media, auth, restore, and signed smoke matrices."
      mitigation: "Select the supported release when source work begins, record its support window and macOS floor, land the runtime upgrade as an isolated PR, lock exact versions, and characterize behavior before feature work."
    - risk: "Touch ID WebAuthn is implemented in code but remains unavailable in the signed product."
      evidence: "The installed app lacks keychain-access-groups; Electron 34 lacks configureWebAuthn; Apple restricts Keychain-group entitlements."
      root_cause: "Runtime API, Team-ID group, provisioning authorization, packaging entitlements, and account-selection UX are separate dependencies."
      bias: "Feature-completion bias may equate adding an API call with end-to-end platform capability."
      falsifiable_test: "The final signed app entitlement dump contains the authorized group and a human can register, select, authenticate, cancel, and relaunch a Wake-specific GitHub Touch ID passkey."
      mitigation: "Treat WebAuthn as a signed integration slice with entitlement/provisioning proof and human verification, not a main-process-only patch."
    - risk: "Arc archive import silently breaks or exposes sensitive profile data after Arc schema changes."
      evidence: "Arc documents archive behavior but no export contract; community artifacts show version-sensitive undocumented files."
      root_cause: "The desired migration surface is proprietary and lacks a stable producer-owned schema."
      bias: "Feature parity bias may overvalue seamless import relative to privacy and maintainability."
      falsifiable_test: "Versioned sanitized fixtures from supported Arc versions import exact metadata, unknown schemas fail closed, and filesystem instrumentation shows zero access to excluded stores."
      mitigation: "Ship Arc archives as a user-selected experimental adapter with schema allowlists, preview, no live-profile scan, and fail-closed behavior."
    - risk: "A public release is promoted before the exact candidate receives human install, appearance, OAuth, and passkey approval."
      evidence: "The current workflow is manual-only but does not yet implement protected candidate generation and separate immutable promotion."
      root_cause: "Build, signing, verification, and publication are not modeled as distinct trust transitions."
      bias: "Automation bias may treat green CI as equivalent to user-visible browser correctness."
      falsifiable_test: "A candidate can complete every automated gate while publication remains impossible until a named approval authorizes promotion of the same checksum."
      mitigation: "Use protected GitHub environments and separate candidate/promotion jobs; record artifact SHA-256 in the human checklist."
  paper_tigers:
    - risk: "Wake users need their own Apple Developer accounts."
      why_manageable: "Publisher CI owns signing/notarization. Installing users need no developer membership or Apple credential."
    - risk: "All five missing Apple values must block every GitHub build."
      why_manageable: "Only the signed public candidate lane needs signing/notarization inputs; pull-request build and test can be credential-free after workflow separation."
    - risk: "Zen must be forked to obtain its productivity features."
      why_manageable: "Workspaces, compact navigation, split views, tab unloading, and recovery can be evaluated as product patterns and implemented independently in Electron."
  elephants:
    - risk: "The original source may be deleted rather than merely inaccessible."
      why_avoided: "The prior successful private checkout and current GH_PAT secret make access loss look temporary, but current 404 responses cannot distinguish private from deleted."
      true_impact: "If no repository or backup exists, Wake needs an explicitly funded source-reconstruction project before maintainable product completion."
    - risk: "A browser product creates long-term security maintenance obligations beyond feature development."
      why_avoided: "Immediate visible bugs make runtime cadence, provider compatibility, extension isolation, permission UX, and vulnerability response feel secondary."
      true_impact: "Wake needs a recurring Electron update policy, compatibility matrix, security review, and release cadence or it will return to an unsupported browser engine."
